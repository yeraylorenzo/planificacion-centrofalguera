<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#38808c" />
  <title>Planificación · SD Conxo</title>
  <style>
    :root{--ink:#222221;--muted:#5f7478;--canvas:#fffefa;--line:#d7e6e7;--blue:#38808c;--deep:#286a75;--light:#e7f4f5;--soft:#f2f7f7}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:900px;margin:auto;padding:0 16px 85px}.cover{position:relative;display:flex;align-items:center;gap:14px;min-height:136px;margin:0 -16px;padding:24px 16px;color:#fffefa;overflow:hidden;background:linear-gradient(125deg,#38808c,#286a75)}.cover:after{content:"";position:absolute;width:170px;height:170px;right:-40px;bottom:-65px;border:25px solid #ffffff1b;border-radius:50%}.cover img{z-index:1;width:62px;height:62px;object-fit:contain;filter:brightness(0) invert(1)}.cover p,.eyebrow{margin:0;font-size:10px;font-weight:850;letter-spacing:.14em}.cover p{color:#ffffffb5}.cover h1{z-index:1;margin:4px 0 0;font-size:26px;line-height:1;letter-spacing:-.06em}.cover>span{position:absolute;z-index:1;right:17px;bottom:16px;font-size:9px;font-weight:850;letter-spacing:.12em;color:#ffffffb5}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:17px 0}.top h2{margin:0;font-size:17px;letter-spacing:-.04em}.top p{margin:0;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.12em}.refresh{padding:9px 11px;border:1px solid #cce4e6;border-radius:11px;background:var(--light);color:var(--deep);font-weight:850;font-size:11px;cursor:pointer}.status{display:flex;gap:7px;align-items:center;margin:0 0 13px;color:#52767a;font-size:11px;font-weight:700}.status i{width:7px;height:7px;border-radius:50%;background:#72b9c7}.status small{margin-left:auto;color:#829497;font-size:9px}.dates{display:flex;gap:7px;overflow:auto;margin:0 -16px 18px;padding:12px 16px 15px;background:var(--soft)}.dates button{flex:0 0 70px;display:grid;gap:2px;min-height:64px;padding:8px;border:1px solid transparent;border-radius:12px;background:transparent;color:#5d7478;text-align:center;cursor:pointer}.dates button.active{background:var(--deep);color:#fff;box-shadow:0 7px 17px #286a7526}.dates small{font-size:9px;font-weight:850}.dates strong{font-size:19px;line-height:1}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 16px;padding:5px;border-radius:13px;background:var(--soft)}.tabs button{padding:9px;border:0;border-radius:9px;background:transparent;color:#64777a;font-size:11px;font-weight:800;cursor:pointer}.tabs button.active{color:var(--deep);background:#fff;box-shadow:0 2px 8px #123a4012}.hero{padding:21px;border-radius:18px;color:#fff;background:linear-gradient(135deg,#286a75,#38808c)}.hero .eyebrow{color:#ffffffae}.hero h2{margin:7px 0 3px;font-size:31px;line-height:1.05;letter-spacing:-.065em}.hero p{margin:0;color:#ffffffc7;font-size:13px}.stats{display:flex;gap:15px;margin-top:18px;padding-top:12px;border-top:1px solid #ffffff3a;font-size:11px;font-weight:800}.panel{margin-top:16px;padding:16px;border:1px solid var(--line);border-radius:18px;background:#fffefa}.panel-head{display:flex;justify-content:space-between;align-items:start;gap:10px;margin-bottom:12px}.panel-head h3{margin:3px 0 0;font-size:17px;letter-spacing:-.04em}.eyebrow{color:var(--muted)}.task{display:grid;grid-template-columns:29px 1fr auto;gap:10px;padding:12px 0;border-top:1px solid #e7eeee}.task:first-child{border-top:0}.task>b{display:grid;place-items:center;width:27px;height:27px;border-radius:8px;background:var(--light);color:var(--deep);font-size:9px}.task h4{margin:2px 0;font-size:14px;line-height:1.22}.task p{margin:0;color:#607276;font-size:11px}.task aside{text-align:right;font-size:12px;font-weight:850;white-space:nowrap}.hint{margin:-3px 0 13px;color:var(--muted);font-size:11px}.block{margin-top:15px}.block header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 11px;border:1px solid #cfe5e7;border-radius:12px;background:linear-gradient(100deg,#e8f4f5,#fffefa)}.block header div{display:flex;align-items:center;gap:8px;min-width:0}.badge{display:grid;place-items:center;width:29px;height:29px;border-radius:8px;background:var(--blue);color:#fff;font-size:9px;font-weight:900}.block h4{margin:0;color:#285a61;font-size:13px;overflow-wrap:anywhere}.block header small{font-size:10px;font-weight:800;color:#5c7e83;white-space:nowrap}.exercise{display:grid;grid-template-columns:minmax(58px,76px) minmax(0,1fr) auto;gap:8px;align-items:start;margin-top:8px;padding:11px;border:1px solid #dce8e8;border-radius:14px;background:#fffefa}.tag{display:inline-block;max-width:100%;padding:4px 6px;border-radius:5px;background:#e5f3f4;color:var(--deep);font-size:8px;font-weight:900;line-height:1.28;overflow-wrap:anywhere}.order{display:block;padding:3px;color:#91a3a2;font-size:10px;font-weight:800}.exercise h5{margin:2px 0 0;font-size:13px;line-height:1.28;overflow-wrap:anywhere}.exercise p{margin:4px 0 0;color:#6b7b71;font-size:10px}.dose{text-align:right}.dose span{display:block;color:#78877e;font-size:8px;font-weight:850;text-transform:uppercase}.dose b{font-size:15px;white-space:nowrap}.prescription,.meta,.video{grid-column:2/-1}.prescription{padding-top:7px;border-top:1px solid #e9efea;color:var(--deep);font-weight:850;font-size:13px}.meta{margin-top:4px;font-size:9px;color:#52747a;font-weight:800}.video{display:grid;grid-template-columns:76px 1fr;gap:10px;min-height:52px;overflow:hidden;margin-top:4px;border:1px solid #cfe5e7;border-radius:10px;background:#eff8f8;color:#285a61;text-decoration:none;font-size:11px;font-weight:850}.video img{width:76px;height:52px;object-fit:cover}.video span{display:flex;align-items:center;gap:7px}.play{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--deep);color:#fff;font-size:8px}.week-item{display:grid;grid-template-columns:57px 1fr auto;gap:9px;padding:13px 0;border-top:1px solid #edf0ed;cursor:pointer}.week-item:first-child{border-top:0}.week-item b{display:block;color:var(--deep);font-size:10px}.week-item small{color:var(--muted);font-size:10px}.week-item h4{margin:0;font-size:13px}.week-item p{margin:2px 0;color:var(--muted);font-size:10px}.week-item aside{font-weight:850;font-size:13px;text-align:right}.load-number{font-size:43px!important}.empty{padding:23px 3px;color:var(--muted);text-align:center}.hidden{display:none}@media(min-width:700px){.app{padding-inline:28px}.cover{margin-inline:-28px;padding-inline:28px}.dates{margin-inline:-28px;padding-inline:28px}.hero{padding:28px}.exercise{grid-template-columns:84px minmax(0,1fr) auto}.top{padding:21px 0}} 
  </style>
</head>
<body><main class="app">
  <section class="cover"><img src="centro-falguera-isotipo.png" alt="Centro Falguera"><div><p>CENTRO FALGUERA</p><h1>Preparación física</h1></div><span>SD CONXO</span></section>
  <header class="top"><div><p>SD CONXO</p><h2>Planificación</h2></div><button class="refresh" id="refresh">Actualizar</button></header>
  <div class="status"><i></i><span id="status">Cargando planificación actualizada…</span><small>Se actualiza al abrir</small></div>
  <div class="dates" id="dates"></div><nav class="tabs"><button data-view="session" class="active">Sesión</button><button data-view="week">Semana</button><button data-view="load">Carga</button></nav>
  <div id="content"></div>
</main><script>
const PUB='https://docs.google.com/spreadsheets/d/e/2PACX-1vRuCuFspkZP_sDs1aXwqt7uJRwh6PSxW2eugiRK9DdgwTfmfM0LVWyTaLiDbcT6Kq2WkMyj4mN5vq3_',GIDS=[1493100356,2100000001,2100000002,2100000003,2100000004,2100000005,2100000006],LIB=605054788,MACRO=1143449359,DAYS=['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];let sessions=[],selected='',view='session',macro={weeks:'—',load:'—',intensity:'—'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const val=(r,c)=>(r?.[c]||'').trim();const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]/gi,'').toUpperCase();const num=s=>Number(String(s).replace(',','.'))||0;
function csv(t){let out=[],row=[],cell='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){cell+='"';i++}else q=!q}else if(c===','&&!q){row.push(cell.trim());cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;row.push(cell.trim());out.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell.trim());out.push(row)}return out}async function sheet(g){let r=await fetch(`${PUB}/pub?gid=${g}&single=true&output=csv&cb=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error();return csv(await r.text())}
function dateInfo(raw){let [d,m,y]=raw.split('/'),dt=new Date(Number(y.length===2?'20'+y:y),Number(m)-1,Number(d));return{id:`${y.length===2?'20'+y:y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`,date:`${d.padStart(2,'0')} ${['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'][Number(m)-1]||''}`,day:DAYS[dt.getDay()]||''}}
function parse(rows,links){let out=[];for(let start=0;start<70;start+=10){let raw=val(rows[6],start+2);if(!/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(raw))continue;let info=dateInfo(raw),tasks=[];for(let r=10;r<=17;r++){let title=val(rows[r],start+2),phase=val(rows[r],start+1);if(val(rows[r],start).toUpperCase()==='FORZA'||phase.toUpperCase()==='ORIENTACIÓN')break;if(title)tasks.push({phase,title,objective:val(rows[r],start+3),format:val(rows[r],start+4),series:val(rows[r],start+6),work:val(rows[r],start+7),rest:val(rows[r],start+8),minutes:num(val(rows[r],start+9))})}let ex=[],block='',read=false;for(let r=18;r<rows.length;r++){let h=val(rows[r],start).toUpperCase();if(h==='QUECEMENTO'){block='Calentamiento';read=false;continue}if(h.includes('PARTE PRINCIPAL- B1')){block='B1 · Bloque principal';read=false;continue}if(h.includes('PARTE PRINCIPAL- B2')){block='B2 · Bloque complementario';read=false;continue}if(h.includes('PLIOMETRÍA')||h.includes('CONDICIONAL')||h.includes('CARGA VHSR')||h.includes('RESUMEN CARGA')){read=false;continue}if(val(rows[r],start+1).toUpperCase()==='EXERCICIO'&&block){read=true;continue}let title=val(rows[r],start+1);if(!read||!title||['EXERCICIO','ORIENTACIÓN'].includes(title.toUpperCase())||!val(rows[r],start+2)||!val(rows[r],start+6))continue;let time=val(rows[r],start+5),reps=val(rows[r],start+3),load=val(rows[r],start+4);ex.push({block,content:val(rows[r],start),title,series:val(rows[r],start+2),prescription:time?`${reps}${reps&&time?' · ':''}${time} s`:`${reps}${load?' · '+load+' kg':''}`,rir:val(rows[r],start+6),note:val(rows[r],start+7),video:links.get(norm(title))})}if(tasks.length||ex.length)out.push({...info,location:ex.length?'Gimnasio':'Campo',title:tasks[0]?.title||'Sesión de gimnasio',minutes:tasks.reduce((a,x)=>a+x.minutes,0)||(ex.length?35:0),rpe:tasks.length?'—':'6',tasks,ex})}return out}
function yid(u){return (u||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/)?.[1]||''}function week(id){let d=new Date(id+'T12:00:00'),n=(d.getDay()+6)%7;d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)}
function render(){let s=sessions.find(x=>x.id===selected)||sessions[0],wk=sessions.filter(x=>week(x.id)===week(s.id));document.querySelector('#dates').innerHTML=wk.map(x=>`<button class="${x.id===selected?'active':''}" data-id="${x.id}"><small>${x.day}</small><strong>${x.date.slice(0,2)}</strong><small>${x.location}</small></button>`).join('');document.querySelectorAll('#dates button').forEach(b=>b.onclick=()=>{selected=b.dataset.id;view='session';render()});let html='';if(view==='session'){html=`<section class="hero"><div class="eyebrow">${s.day} · ${s.date} · ${s.location.toUpperCase()}</div><h2>${esc(s.title)}</h2><p>${s.location==='Campo'?'Tareas de campo':'Ejercicios, series y repeticiones'}</p><div class="stats"><span>◷ ${s.minutes||'—'} min</span><span>◉ RPE ${s.rpe}</span></div></section>`;if(s.tasks.length)html+=`<section class="panel"><div class="panel-head"><div><p class="eyebrow">PLAN DEL DÍA</p><h3>Orden de sesión</h3></div></div>${s.tasks.map((t,i)=>`<article class="task"><b>${String(i+1).padStart(2,'0')}</b><div><small class="eyebrow">${esc(t.phase||'TAREA')}</small><h4>${esc(t.title)}</h4><p>${esc([t.objective,t.format,t.series&&t.series+' series',t.work,t.rest&&'pausa '+t.rest].filter(Boolean).join(' · '))}</p></div><aside>${t.minutes||'—'} min</aside></article>`).join('')}</section>`;if(s.ex.length){let bs=[...new Set(s.ex.map(x=>x.block))];html+=`<section class="panel"><div class="panel-head"><div><p class="eyebrow">SESIÓN COMPLETA</p><h3>Ejercicios por bloques</h3></div></div><p class="hint">Las repeticiones unilaterales se expresan como total.</p>${bs.map(b=>`<section class="block"><header><div><span class="badge">${b.startsWith('B')?b.slice(0,2):'A'}</span><h4>${esc(b)}</h4></div><small>${s.ex.filter(x=>x.block===b).length} ejercicios</small></header>${s.ex.filter(x=>x.block===b).map((x,i)=>{let id=yid(x.video);return `<article class="exercise"><div><span class="tag">${esc(x.content||'EJ')}</span><b class="order">${String(i+1).padStart(2,'0')}</b></div><div><h5>${esc(x.title)}</h5>${x.note?`<p>${esc(x.note)}</p>`:''}</div><div class="dose"><span>Series</span><b>${esc(x.series)}</b></div><div class="prescription">${esc(x.prescription||'—')}</div><div class="meta">RIR ${esc(x.rir||'—')}</div>${id?`<a class="video" target="_blank" rel="noreferrer" href="https://www.youtube.com/watch?v=${id}"><img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="Vídeo de ${esc(x.title)}"><span><i class="play">▶</i> Ver vídeo</span></a>`:''}</article>`}).join('')}</section>`).join('')}</section>`}if(!s.tasks.length&&!s.ex.length)html+='<section class="panel empty">Aún no hay tareas en esta sesión.</section>'}else if(view==='week'){html=`<section class="panel"><div class="panel-head"><div><p class="eyebrow">PLANIFICACIÓN PUBLICADA</p><h3>Vista semanal</h3></div></div>${wk.map(x=>`<article class="week-item" data-open="${x.id}"><div><b>${x.day}</b><small>${x.date}</small></div><div><h4>${esc(x.title)}</h4><p>${x.tasks.length?x.tasks.length+' tareas':x.ex.length+' ejercicios'} · ${x.location}</p></div><aside>${x.minutes||'—'}′</aside></article>`).join('')}</section>`}else{html=`<section class="hero"><p class="eyebrow">CARGA MACRO</p><h2 class="load-number">${esc(macro.load)} <small>u.</small></h2><p>Carga planificada acumulada</p><div class="stats"><span>Semanas con carga ${esc(macro.weeks)}</span><span>Intensidad media ${esc(macro.intensity)}</span></div></section><section class="panel"><p class="hint">Los indicadores se actualizan al abrir la web con la información publicada en la hoja.</p></section>`}document.querySelector('#content').innerHTML=html;document.querySelectorAll('[data-open]').forEach(e=>e.onclick=()=>{selected=e.dataset.open;view='session';render()});document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}
async function load(){let status=document.querySelector('#status'),btn=document.querySelector('#refresh');btn.disabled=true;btn.textContent='Actualizando…';status.textContent='Actualizando desde la hoja…';try{let [lib,...all]=await Promise.all([sheet(LIB),...GIDS.map(sheet),sheet(MACRO)]),links=new Map();lib.slice(1).forEach(r=>{if(val(r,0)&&val(r,1).startsWith('http'))links.set(norm(val(r,0)),val(r,1))});sessions=all.slice(0,GIDS.length).flatMap(r=>parse(r,links)).sort((a,b)=>a.id.localeCompare(b.id));let m=all[GIDS.length];macro={weeks:val(m[5],0)||'—',load:val(m[5],5)||'—',intensity:val(m[5],15)||'—'};if(!sessions.length)throw Error();selected=sessions.find(x=>x.id===selected)?.id||sessions[0].id;status.textContent='Planificación sincronizada · '+new Intl.DateTimeFormat('es-ES',{hour:'2-digit',minute:'2-digit'}).format(new Date());render()}catch(e){status.textContent='No se pudo actualizar ahora. Prueba de nuevo en unos segundos.';document.querySelector('#content').innerHTML='<section class="panel empty">La planificación se mostrará cuando se complete la conexión.</section>'}finally{btn.disabled=false;btn.textContent='Actualizar'}}document.querySelector('#refresh').onclick=load;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});load();
  </script></body></html>
